name: Actualizar episodios
on:
  schedule:
    - cron: '0 16 * * 3,4'   # miércoles y jueves, 16:00 UTC (10:00 en CDMX)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Buscar episodios nuevos y regenerar el sitio
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python update_episodes.py
      - name: Guardar cambios (Vercel publica solo)
        run: |
          git config user.name "gritones-bot"
          git config user.email "bot@gritonestudio.com"
          git add -A
          git diff --cached --quiet || git commit -m "Episodios nuevos (revisión automática)"
          git push
